appId: dev.voxterm.app
productName: VoxTerm
copyright: Copyright © 2026 VoxTerm

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - resources/**
  - node_modules/node-pty/**

linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Voice-ready terminal workspace for Linux
  description: VoxTerm is a premium desktop workspace for real operating-system terminals, coding-agent sessions, and voice-driven developer workflows.
  maintainer: VoxTerm
  icon: resources/icon.png

npmRebuild: true
