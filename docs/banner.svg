<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="VoxTerm banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <font id="f"/>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="272" rx="14" fill="none" stroke="url(#stroke)" stroke-width="2"/>

  <!-- ⬤ ● terminal dots -->
  <circle cx="64" cy="64" r="7" fill="#ff5f57"/>
  <circle cx="88" cy="64" r="7" fill="#febc2e"/>
  <circle cx="112" cy="64" r="7" fill="#28c840"/>

  <!-- Voice waveform -->
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <line x1="96"  y1="200" x2="96"  y2="230"/>
    <line x1="116" y1="185" x2="116" y2="245"/>
    <line x1="136" y1="170" x2="136" y2="260"/>
    <line x1="156" y1="190" x2="156" y2="240"/>
    <line x1="176" y1="178" x2="176" y2="252"/>
    <line x1="196" y1="198" x2="196" y2="232"/>
  </g>

  <!-- Prompt caret / terminal prompt -->
  <g filter="url(#glow)">
    <rect x="86" y="110" width="30" height="12" rx="3" fill="#60a5fa"/>
    <rect x="124" y="110" width="260" height="12" rx="3" fill="#243b55"/>
    <rect x="124" y="132" width="180" height="12" rx="3" fill="#243b55"/>
    <rect x="312" y="132" width="10" height="12" fill="#a78bfa"/>
  </g>

  <!-- Title -->
  <text x="440" y="128" font-family="Segoe UI, Ubuntu, sans-serif" font-size="84" font-weight="700" fill="#e6edf3">VoxTerm</text>
  <text x="444" y="180" font-family="Segoe UI, Ubuntu, sans-serif" font-size="28" fill="#8b949e">type less. talk more. ship code.</text>

  <!-- Feature chips -->
  <g font-family="JetBrains Mono, monospace" font-size="20" font-weight="600">
    <g><rect x="440" y="212" rx="18" width="230" height="42" fill="#5eead414" stroke="#5eead4aa"/><text x="462" y="239" fill="#5eead4">🎙 elevenlabs stt</text></g>
    <g><rect x="686" y="212" rx="18" width="238" height="42" fill="#60a5fa14" stroke="#60a5faaa"/><text x="708" y="239" fill="#60a5fa">💻 real node-pty</text></g>
    <g><rect x="940" y="212" rx="18" width="236" height="42" fill="#a78bfa14" stroke="#a78bfaaa"/><text x="958" y="239" fill="#a78bfa">🤖 gemma agents</text></g>
    <g><rect x="440" y="266" rx="18" width="210" height="42" fill="#f59e0b14" stroke="#f59e0baa"/><text x="460" y="293" fill="#f59e0b">🔊 elevenlabs</text></g>
    <g><rect x="666" y="266" rx="18" width="262" height="42" fill="#34d39914" stroke="#34d399aa"/><text x="688" y="293" fill="#34d399">🔒 local-only privacy</text></g>
    <g><rect x="944" y="266" rx="18" width="232" height="42" fill="#60a5fa14" stroke="#60a5faaa"/><text x="966" y="293" fill="#60a5fa">🖥 tmux + screen</text></g>
  </g>
</svg>
